name: Build CineDor (Direct Files)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (যেমন 3.0.0) — প্রতিবার বাড়াবে"
        required: true
        default: "3.0.0"
      notes:
        description: "কী নতুন"
        required: false
        default: "CineDor — WebView & Download system update"

      tmdb_key:
        description: "TMDB API key (ঐচ্ছিক)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      IN_VERSION: ${{ inputs.version }}
      IN_NOTES: ${{ inputs.notes }}
      TMDB_API_KEY: ${{ inputs.tmdb_key || secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Version setup
        run: |
          if [ -n "$TMDB_API_KEY" ]; then echo "::add-mask::$TMDB_API_KEY"; fi
          VER="${IN_VERSION#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.0.0"; exit 1; fi
          IFS=. read -r MA MI PA <<< "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "CODE=$(( 10#$MA * 10000 + 10#$MI * 100 + 10#$PA ))" >> "$GITHUB_ENV"

      - name: Make Android project from repository files
        run: |
          python3 - <<'PY'
          import os, re, shutil, sys

          # রুট ফোল্ডার থেকে .java এবং .xml ফাইলগুলো সংগ্রহ করা
          skip = lambda f: ' (' in f or f.startswith('_') or f.startswith('.')
          files = [f for f in os.listdir('.') if os.path.isfile(f) and not skip(f)]
          
          javas = [f for f in files if f.endswith('.java')]
          xmls = [f for f in files if f.endswith('.xml')]

          print(f"Found Java files: {len(javas)}, XML files: {len(xmls)}")

          if not javas:
              print('::error::কোনো .java ফাইল পাওয়া যায়নি!'); 
              sys.exit(1)

          B = '_build'
          shutil.rmtree(B, ignore_errors=True)
          
          pkg = 'com.cinedor.app'
          for j in javas:
              try:
                  content = open(j, encoding='utf-8').read()
                  m = re.search(r'^\s*package\s+([\w.]+)\s*;', content, re.M)
                  if m: 
                      pkg = m.group(1)
                      break
              except Exception:
                  pass

          print('Package:', pkg)
          src = f'{B}/app/src/main'
          jdir = f'{src}/java/' + pkg.replace('.', '/')
          for d in [jdir, f'{src}/res/layout', f'{src}/res/values', f'{src}/res/xml', f'{src}/res/mipmap-xxxhdpi', f'{src}/res/drawable-nodpi', f'{src}/res/mipmap-anydpi-v26']:
              os.makedirs(d, exist_ok=True)

          for j in javas: 
              if os.path.exists(j): shutil.copy(j, jdir)

          for x in xmls:
              if x.startswith('AndroidManifest'): continue
              try:
                  head = open(x, encoding='utf-8').read(700)
                  if x == 'network_security_config.xml': dest = 'xml'
                  elif '<resources' in head: dest = 'values'
                  elif re.search(r'<(vector|shape|selector|ripple|layer-list)\b', head): dest = 'drawable'
                  else: dest = 'layout'
                  os.makedirs(f'{src}/res/{dest}', exist_ok=True)
                  shutil.copy(x, f'{src}/res/{dest}/')
              except Exception:
                  pass

          key = os.environ.get('TMDB_API_KEY', '').strip()
          open(f'{jdir}/Keys.java', 'w').write('package %s;\n\nfinal class Keys {\n    static final String TMDB = "%s";\n    private Keys() {}\n}\n' % (pkg, key))

          if os.path.exists('ic_launcher.png'):
              shutil.copy('ic_launcher.png', f'{src}/res/mipmap-xxxhdpi/')
              shutil.copy('ic_launcher_round.png' if os.path.exists('ic_launcher_round.png') else 'ic_launcher.png', f'{src}/res/mipmap-xxxhdpi/ic_launcher_round.png')

          open(f'{src}/res/values/colors_gen.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="icon_bg">#0E0F12</color></resources>\n')
          if not os.path.exists(f'{src}/res/values/strings.xml'):
              open(f'{src}/res/values/strings.xml', 'w').write('<resources><string name="app_name">CineDor</string></resources>')

          nsc = 'android:usesCleartextTraffic="true"'
          names = [j[:-5] for j in javas]
          launcher = 'VideoListActivity' if 'VideoListActivity' in names else ('MainActivity' if 'MainActivity' in names else None)
          acts = []
          for n in names:
              try:
                  code = open(f'{n}.java', encoding='utf-8').read()
                  if not re.search(r'extends\s+\w*Activity\b', code): continue
                  extra = ''
                  if n == 'PlayerActivity':
                      extra = ' android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"'
                  if n == launcher:
                      acts.append(f'    <activity android:name="{pkg}.{n}" android:exported="true"{extra}>\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN"/>\n        <category android:name="android.intent.category.LAUNCHER"/>\n      </intent-filter>\n    </activity>')
                  else:
                      acts.append(f'    <activity android:name="{pkg}.{n}" android:exported="false"{extra}/>')
              except Exception:
                  pass

          open(f'{src}/AndroidManifest.xml', 'w').write(f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <application android:label="CineDor" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" {nsc} android:theme="@style/Theme.Material3.Dark.NoActionBar">
          {chr(10).join(acts)}
            </application>
          </manifest>
          ''')

          open(f'{B}/settings.gradle.kts', 'w').write('''pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CinedorPlayer"
          include(":app")
          ''')
          open(f'{B}/build.gradle.kts', 'w').write('plugins { id("com.android.application") version "8.5.2" apply false }\n')
          open(f'{B}/gradle.properties', 'w').write('org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n')
          
          open(f'{B}/app/build.gradle.kts', 'w').write(f'''plugins {{ id("com.android.application") }}
          val vName = (project.findProperty("vName") as String?) ?: "1.0.0"
          val vCode = (project.findProperty("vCode") as String?)?.toIntOrNull() ?: 1
          val ks = file("release.jks")
          android {{
              namespace = "{pkg}"
              compileSdk = 34
              defaultConfig {{ applicationId = "com.cinedor.app"; minSdk = 24; targetSdk = 34; versionCode = vCode; versionName = vName }}
              signingConfigs {{ create("release") {{ if (ks.exists()) {{ storeFile = ks; storePassword = System.getenv("KEYSTORE_PASSWORD"); keyAlias = "cinedor"; keyPassword = System.getenv("KEYSTORE_PASSWORD") }} }} }}
              buildTypes {{ release {{ isMinifyEnabled = false; signingConfig = if (ks.exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug") }} }}
              compileOptions {{ sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }}
              lint {{ abortOnError = false; checkReleaseBuilds = false }}
          }}
          dependencies {{
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }}
          ''')
          print('Project setup completed successfully from direct repository files.')
          PY

      - name: Keystore setup
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > _build/app/release.jks
          else
            echo "::warning::KEYSTORE_BASE64 secret নেই — debug key দিয়ে সাইন হবে"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p _build :app:assembleRelease -PvName="$VER" -PvCode="$CODE" --no-daemon --stacktrace

      - name: Rename APK
        run: cp _build/app/build/outputs/apk/release/app-release.apk "CineDor-v$VER.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: player-v${{ env.VER }}
          name: CineDor v${{ env.VER }}
          body: ${{ env.IN_NOTES }}
          files: CineDor-v${{ env.VER }}.apk
          make_latest: false

      - name: Clean up
        if: always()
        run: rm -f _build/app/release.jks || true
